name: forecast-etl

services:
  warehouse:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${WAREHOUSE_DATABASE:?Set WAREHOUSE_DATABASE in .env}
      POSTGRES_USER: ${WAREHOUSE_USER:?Set WAREHOUSE_USER in .env}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-5432}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "timezone=UTC"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  warehouse_data:
