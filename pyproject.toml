[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "open-meteo-forecast-etl"
version = "0.1.0"
description = "A versioned Open-Meteo forecast ETL portfolio project"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
warehouse = ["psycopg[binary]==3.3.5", "python-dotenv==1.2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
